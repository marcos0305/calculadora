
<div class="calculator-container">
<input class="display" type="text" [(ngModel)]="display" readonly class="display" />

<table>
    <tr>
      <td><button (click)="botao('7')">7</button></td>
      <td><button (click)="botao('8')">8</button></td>
      <td><button (click)="botao('9')">9</button></td>
      <td><button (click)="botao('+')">+</button></td>
    </tr>

    <tr>
        <td><button (click)="botao('4')">4</button></td>
        <td><button (click)="botao('5')">5</button></td>
        <td><button (click)="botao('6')">6</button></td>
        <td><button (click)="botao('-')">-</button></td>
    </tr>

    <tr>
        <td><button (click)="botao('1')">1</button></td>
        <td><button (click)="botao('2')">2</button></td>
        <td><button (click)="botao('3')">3</button></td>
        <td><button (click)="botao('*')">*</button></td>
    </tr>
    
     <tr>
        <td><button (click)="botao('.')">.</button></td>
        <td><button (click)="botao('0')">0</button></td>
        <td><button (click)="botao('/')">/</button></td>
        <td><button (click)="calculate()">=</button></td>
    </tr>
    <tr>
        <td colspan="4"><button (click)="clear()" class="btn-clear">C</button></td>
    </tr>
    
</table>

</div>
